name: Package Release to GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '上游 Release Tag (留空或填写 latest 自动获取最新版本)'
        required: false
        type: string
        default: 'latest'
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 确定目标版本 Tag (自动解析最新版)
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_TAG="${{ inputs.tag }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            INPUT_TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "${INPUT_TAG}" ] || [ "${INPUT_TAG}" = "latest" ]; then
            echo "正在向上游 smagicalk/smalux-speedtest 查询最新 Release..."
            TARGET_TAG=$(gh release view --repo smagicalk/smalux-speedtest --json tagName -q .tagName)
            echo "成功获取最新版本: ${TARGET_TAG}"
          else
            TARGET_TAG="${INPUT_TAG}"
          fi

          echo "tag=${TARGET_TAG}" >> $GITHUB_OUTPUT

      - name: 下载并解压 Release 二进制包
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          FILENAME="smalux-speedtest-${TAG}-linux-amd64.tar.gz"
          DOWNLOAD_URL="https://github.com/smagicalk/smalux-speedtest/releases/download/${TAG}/${FILENAME}"

          echo "正在下载: ${DOWNLOAD_URL}"
          curl -fL -o "${FILENAME}" "${DOWNLOAD_URL}"

          tar -zxvf "${FILENAME}"
          chmod +x smalux-server smalux-client entrypoint.sh

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smalux-speedtest
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}