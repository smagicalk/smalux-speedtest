name: Package Release to GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '上游 Release Tag (留空或填写 latest 自动获取最新版本)'
        required: false
        type: string
        default: 'latest'
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 确定目标版本 Tag
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_TAG="${{ inputs.tag }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            INPUT_TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "${INPUT_TAG}" ] || [ "${INPUT_TAG}" = "latest" ]; then
            echo "正在向上游 smagicalk/smalux-speedtest 查询最新 Release..."
            TARGET_TAG=$(gh release view --repo smagicalk/smalux-speedtest --json tagName -q .tagName)
            echo "获取到最新版本: ${TARGET_TAG}"
          else
            TARGET_TAG="${INPUT_TAG}"
          fi

          echo "tag=${TARGET_TAG}" >> $GITHUB_OUTPUT

      - name: 下载并解压 Release 包
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          FILENAME="smalux-speedtest-${TAG}-linux-amd64.tar.gz"
          DOWNLOAD_URL="https://github.com/smagicalk/smalux-speedtest/releases/download/${TAG}/${FILENAME}"

          echo "正在下载: ${DOWNLOAD_URL}"
          curl -fL -o "${FILENAME}" "${DOWNLOAD_URL}"

          tar -zxvf "${FILENAME}"
          chmod +x smalux-server smalux-client

      - name: 动态生成 entrypoint 与 Alpine Dockerfile
        run: |
          # 1. 编写入口脚本
          cat << 'EOF' > entrypoint.sh
          #!/bin/sh
          set -e

          if [ "$MODE" = "client" ]; then
              exec smalux-client "$@"
          else
              exec smalux-server "$@"
          fi
          EOF
          chmod +x entrypoint.sh

          # 2. 编写 Dockerfile 并声明环境变量
          cat << 'EOF' > Dockerfile
          FROM alpine:latest

          RUN apk add --no-cache ca-certificates tzdata gcompat

          WORKDIR /app

          COPY smalux-server /usr/local/bin/smalux-server
          COPY smalux-client /usr/local/bin/smalux-client
          COPY entrypoint.sh /usr/local/bin/entrypoint.sh

          # 运行模式（默认服务端）
          ENV MODE=server

          # 鉴权与管理环境变量预设
          ENV SMALUX_ADMIN_PASSWORD=""
          ENV SMALUX_CLIENT_TOKEN=""

          EXPOSE 8080

          ENTRYPOINT ["/usr/local/bin/entrypoint.sh"]
          EOF

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smalux-speedtest
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}