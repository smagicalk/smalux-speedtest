name: Build And Release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

# Build jobs only need to read the repository. The publish job below requests write
# access separately and only runs when a real Release target was provided.
permissions:
  contents: read

concurrency:
  group: smalux-release-${{ github.event.release.tag_name || github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    name: Test source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Verify release tag and record commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          if [[ -n "$RELEASE_TAG" ]]; then
            git check-ref-format "refs/tags/$RELEASE_TAG"
            tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
            if [[ -z "$tag_commit" || "$commit" != "$tag_commit" ]]; then
              printf 'checked out commit does not match release tag %s\n' "$RELEASE_TAG" >&2
              exit 1
            fi
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -buildvcs=false -tags with_utls ./...

  select-build-matrix:
    name: Select build targets
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select all release targets
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'matrix={"include":[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"},{"goos":"windows","goarch":"amd64"},{"goos":"windows","goarch":"arm64"},{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"}]}' \
            >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [test, select-build-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-build-matrix.outputs.matrix) }}
    env:
      VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.test.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="${VERSION:-dev}"
          safe_version="$(printf '%s' "$version" | LC_ALL=C tr -c 'A-Za-z0-9._-' '-' | cut -c1-64)"
          safe_version="${safe_version:-dev}"
          archive_base="smalux-speedtest-${safe_version}-${GOOS}-${GOARCH}"
          package_dir="build/package"
          rm -rf build
          mkdir -p "$package_dir"
          ldflags="-s -w -X main.version=${safe_version}"
          extension=""
          if [[ "$GOOS" == "windows" ]]; then
            extension=".exe"
          fi

          GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
            go build -buildvcs=false -trimpath -ldflags "$ldflags" \
            -o "$package_dir/smalux-server${extension}" ./server
          GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
            go build -buildvcs=false -trimpath -tags with_utls -ldflags "$ldflags" \
            -o "$package_dir/smalux-client${extension}" ./client

          if [[ "$GOOS" == "windows" ]]; then
            archive="build/${archive_base}.zip"
            (cd "$package_dir" && zip -q "../${archive_base}.zip" ./*)
          else
            archive="build/${archive_base}.tar.gz"
            tar -C "$package_dir" -czf "$archive" .
          fi

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "archive_base=${archive_base}" >> "$GITHUB_OUTPUT"

      - name: Upload platform package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.archive_base }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

  collect:
    name: Collect checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -t packages < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | LC_ALL=C sort)
          if (( ${#packages[@]} != 6 )); then
            printf 'expected 6 platform packages, found %d\n' "${#packages[@]}" >&2
            exit 1
          fi
          sha256sum "${packages[@]}" > SHA256SUMS

      - name: Upload combined Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smalux-speedtest-release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Release assets
    needs: [test, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
      TESTED_COMMIT: ${{ needs.test.outputs.commit }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download combined release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: smalux-speedtest-release-bundle
          path: release

      - name: Upload assets to the existing Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Smalux Speedtest $RELEASE_TAG" --generate-notes
          fi
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$tag_commit" != "$TESTED_COMMIT" ]]; then
            printf 'release tag moved after testing; expected %s, found %s\n' \
              "$TESTED_COMMIT" "$tag_commit" >&2
            exit 1
          fi

          echo "检查并清理已存在的同名 Release 资产以支持覆盖更新..."
          existing_assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)

          for file in release/*; do
            [ -f "$file" ] || continue
            filename="$(basename "$file")"
            if echo "$existing_assets" | grep -Fxq "$filename"; then
              echo "检测到已存在资产 $filename，执行删除以支持覆盖..."
              gh release delete-asset "$RELEASE_TAG" "$filename" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          done

          echo "开始上传 Release 资产（单文件安全上传并覆盖）..."
          for file in release/*; do
            [ -f "$file" ] || continue
            filename="$(basename "$file")"
            echo "正在上传: $filename"
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber; then
                uploaded=true
                break
              fi
              echo "上传 $filename 第 $attempt 次尝试失败，清理可能残留的同名资产后重试..."
              sleep 2
              gh release delete-asset "$RELEASE_TAG" "$filename" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
              sleep 1
            done

            if [[ "$uploaded" != "true" ]]; then
              echo "资产 $filename 上传失败" >&2
              exit 1
            fi
          done
          echo "所有 Release 资产上传成功！"
