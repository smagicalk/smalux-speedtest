name: Test And Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建测试的分支、Tag 或 Commit'
        required: true
        default: 'vibe-dev'
        type: string
      os:
        description: '目标操作系统 (all 表示编译 linux, windows, darwin)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'linux'
          - 'windows'
          - 'darwin'
      arch:
        description: '目标架构 (all 表示编译 amd64, arm64)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'amd64'
          - 'arm64'
      run_tests:
        description: '构建前是否执行单元测试'
        required: true
        default: true
        type: boolean
      version:
        description: '测试包版本名称 (如 dev, test, pr-12)'
        required: false
        default: 'dev'
        type: string

permissions:
  contents: read

concurrency:
  group: smalux-test-${{ inputs.ref || github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_REF: ${{ inputs.ref || github.ref }}
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Record commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          printf 'Checked out commit: %s\n' "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: go test -buildvcs=false -tags with_utls ./...

  select-build-matrix:
    name: Select build targets
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select targets based on inputs
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          ALL_OS=("linux" "windows" "darwin")
          ALL_ARCH=("amd64" "arm64")

          TARGET_OS="${{ inputs.os }}"
          TARGET_ARCH="${{ inputs.arch }}"

          if [[ "$TARGET_OS" == "all" ]]; then
            SELECTED_OS=("${ALL_OS[@]}")
          else
            SELECTED_OS=("$TARGET_OS")
          fi

          if [[ "$TARGET_ARCH" == "all" ]]; then
            SELECTED_ARCH=("${ALL_ARCH[@]}")
          else
            SELECTED_ARCH=("$TARGET_ARCH")
          fi

          items=()
          for o in "${SELECTED_OS[@]}"; do
            for a in "${SELECTED_ARCH[@]}"; do
              items+=("{\"goos\":\"$o\",\"goarch\":\"$a\"}")
            done
          done

          matrix_json=$(IFS=,; echo "${items[*]}")
          printf 'matrix={"include":[%s]}\n' "$matrix_json" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [test, select-build-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-build-matrix.outputs.matrix) }}
    env:
      VERSION: ${{ inputs.version || 'dev' }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out test source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.test.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="${VERSION:-dev}"
          safe_version="$(printf '%s' "$version" | LC_ALL=C tr -c 'A-Za-z0-9._-' '-' | cut -c1-64)"
          safe_version="${safe_version:-dev}"
          archive_base="smalux-speedtest-${safe_version}-${GOOS}-${GOARCH}"
          package_dir="build/package"
          rm -rf build
          mkdir -p "$package_dir"
          ldflags="-s -w -X main.version=${safe_version}"
          extension=""
          if [[ "$GOOS" == "windows" ]]; then
            extension=".exe"
          fi

          GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
            go build -buildvcs=false -trimpath -ldflags "$ldflags" \
            -o "$package_dir/smalux-server${extension}" ./server
          GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
            go build -buildvcs=false -trimpath -tags with_utls -ldflags "$ldflags" \
            -o "$package_dir/smalux-client${extension}" ./client

          if [[ "$GOOS" == "windows" ]]; then
            archive="build/${archive_base}.zip"
            (cd "$package_dir" && zip -q "../${archive_base}.zip" ./*)
          else
            archive="build/${archive_base}.tar.gz"
            tar -C "$package_dir" -czf "$archive" .
          fi

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "archive_base=${archive_base}" >> "$GITHUB_OUTPUT"

      - name: Upload platform package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.archive_base }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect test artifacts and checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          mapfile -t packages < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | LC_ALL=C sort)
          if (( ${#packages[@]} == 0 )); then
            printf 'no platform packages found\n' >&2
            exit 1
          fi
          sha256sum "${packages[@]}" > SHA256SUMS

      - name: Upload combined test bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smalux-speedtest-test-bundle
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
