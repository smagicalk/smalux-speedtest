{{define "dashboard.html"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{.CSRF}}">
  <title>Smalux Speedtest</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <!-- 全局导航：刷新由 dashboard.js 处理，退出使用普通表单并由服务端校验 CSRF。 -->
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">S</span><strong>Smalux Speedtest</strong></a>
    <div class="top-actions">
      <button id="refresh" class="icon-button" type="button" title="刷新" aria-label="刷新">↻</button>
      <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="quiet" type="submit">退出</button></form>
    </div>
  </header>

  <main class="workspace">
    <!-- 四个指标都由同一轮 Client/任务 API 快照计算，避免额外统计接口。 -->
    <section class="summary" aria-label="概览">
      <div><span>在线 Client</span><strong id="online-count">0</strong></div>
      <div><span>已注册</span><strong id="client-count">0</strong></div>
      <div><span>进行中任务</span><strong id="running-count">0</strong></div>
      <div><span>历史任务</span><strong id="task-count">0</strong></div>
    </section>

    <!-- Client 注册、在线状态和 Token 吊销入口。 -->
    <section class="section" id="clients-section">
      <div class="section-heading">
        <div><h1>测速节点</h1><p>Client 连接状态与部署信息</p></div>
        <button id="new-client" class="primary" type="button">添加 Client</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>状态</th><th>名称</th><th>平台</th><th>版本</th><th>标签</th><th>最后在线</th><th></th></tr></thead>
          <tbody id="clients-body"><tr><td colspan="7" class="empty">正在加载</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- 代理正文不会持久化；创建成功后仅通过 WebSocket 下发给选中的 Client。 -->
    <section class="section task-builder">
      <div class="section-heading"><div><h2>新建测速任务</h2><p>一次性代理配置不会写入数据库</p></div></div>
      <form id="task-form">
        <div class="form-grid">
          <label class="field wide"><span>分享链接 / Base64 订阅内容</span><textarea name="source" rows="7" spellcheck="false" placeholder="ss://…&#10;vless://…"></textarea></label>
          <label class="field wide"><span>订阅 URL</span><input name="subscription_url" type="url" placeholder="https://example.com/subscription"></label>
          <label class="field"><span>候选测速节点</span><input name="candidate_count" type="number" value="10" min="1" max="50" required></label>
          <label class="field"><span>执行上下行节点</span><select name="top_n"><option value="1">Top 1</option><option value="2">Top 2</option><option value="3" selected>Top 3</option></select></label>
          <label class="field"><span>测速线程数</span><input name="threads" type="number" value="4" min="1" max="32" required></label>
        </div>
        <fieldset><legend>目标 Client</legend><div id="client-options" class="check-grid"><span class="muted">暂无 Client</span></div></fieldset>
        <div id="task-error" class="alert error hidden"></div>
        <div class="form-actions"><button class="primary" type="submit">创建任务</button></div>
      </form>
    </section>

    <!-- 历史表仅展示摘要，详细结果与导出功能位于独立任务页。 -->
    <section class="section">
      <div class="section-heading"><div><h2>任务历史</h2><p>最近 100 条任务</p></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>创建时间</th><th>状态</th><th>代理数</th><th>Client</th><th>测速节点</th><th>线程</th><th></th></tr></thead>
          <tbody id="tasks-body"><tr><td colspan="7" class="empty">正在加载</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 创建 Client 后，服务端只返回一次原始 Token，因此使用独立对话框立即展示。 -->
  <dialog id="client-dialog">
    <form id="client-form" method="dialog">
      <div class="dialog-heading"><h2>添加 Client</h2><button class="icon-button close-dialog" type="button" title="关闭" aria-label="关闭">×</button></div>
      <label class="field"><span>名称</span><input name="name" required maxlength="80"></label>
      <label class="field"><span>标签</span><input name="labels" placeholder="region=hk, provider=example"></label>
      <div class="form-actions"><button class="quiet close-dialog" type="button">取消</button><button class="primary" type="submit">创建</button></div>
    </form>
  </dialog>

  <dialog id="token-dialog">
    <div class="dialog-heading"><h2>Client Token</h2><button class="icon-button close-token" type="button" title="关闭" aria-label="关闭">×</button></div>
    <label class="field"><span>Token</span><textarea id="client-token" rows="3" readonly></textarea></label>
    <div class="form-actions"><button id="copy-token" class="primary" type="button">复制 Token</button></div>
  </dialog>
  <script src="/static/dashboard.js" defer></script>
</body>
</html>
{{end}}
