{{define "login.html"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Smalux Speedtest</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <!-- 登录和邀请注册都由服务端直接处理；认证失败不泄漏账户或邀请的具体状态。 -->
  <main class="login-shell">
    <section class="login-brand-panel" aria-label="Smalux Speedtest">
      <div class="brand-block login-brand">
        <span class="brand-mark">S</span>
        <div><strong>Smalux Speedtest</strong><small>分布式代理测速</small></div>
      </div>
      <div class="login-brand-copy">
        <span class="login-kicker">CONTROL PLANE</span>
        <h1>节点调度、测速执行与结果回传</h1>
        <div class="login-metrics" aria-label="能力概览">
          <span>Client</span><span>Proxy</span><span>Report</span>
        </div>
      </div>
      <span class="login-system-state"><i aria-hidden="true"></i> 管理服务</span>
    </section>
    <section class="login-access">
      <div class="auth-panel">
        <nav class="auth-switch" aria-label="访问方式">
          <a class="{{if ne .Mode "register"}}active{{end}}" href="/login">登录</a>
          <a class="{{if eq .Mode "register"}}active{{end}}" href="/register">邀请码注册</a>
        </nav>
        {{if eq .Mode "register"}}
        <form class="login-form" method="post" action="/register">
          <header><span class="eyebrow">新管理员</span><h2>使用邀请码注册</h2></header>
          {{with .RegisterError}}<p class="alert error" role="alert">{{.}}</p>{{end}}
          <label for="invite-code">邀请码</label>
          <input id="invite-code" name="invite_code" type="text" value="{{.InviteCode}}" autocomplete="one-time-code" maxlength="80" required autofocus>
          <label for="register-username">用户名</label>
          <input id="register-username" name="username" type="text" value="{{.RegisterUsername}}" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z][A-Za-z0-9._-]{2,31}" required>
          <label for="register-password">密码</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
          <label for="register-password-confirm">确认密码</label>
          <input id="register-password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
          <button class="primary full" type="submit">注册并进入控制台</button>
        </form>
        {{else}}
        <form class="login-form" method="post" action="/login">
          <header><span class="eyebrow">管理员访问</span><h2>登录控制台</h2></header>
          {{with .Error}}<p class="alert error" role="alert">{{.}}</p>{{end}}
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" value="{{.Username}}" autocomplete="username" minlength="3" maxlength="32" required autofocus>
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
          <button class="primary full" type="submit">登录</button>
        </form>
        {{end}}
      </div>
    </section>
  </main>
</body>
</html>
{{end}}
